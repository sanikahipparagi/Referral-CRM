services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: referral_crm
      POSTGRES_USER: referral
      POSTGRES_PASSWORD: ${DB_PASSWORD:-referral_local}
    ports: ["5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U referral -d referral_crm"]
      interval: 5s
      timeout: 3s
      retries: 15
  api:
    build: .
    environment:
      DB_URL: jdbc:postgresql://db:5432/referral_crm
      DB_USERNAME: referral
      DB_PASSWORD: ${DB_PASSWORD:-referral_local}
      JWT_SECRET: ${JWT_SECRET:-local-only-change-this-secret-to-a-random-32-byte-minimum-value}
      APP_FOLLOW_UP_DAYS: ${APP_FOLLOW_UP_DAYS:-7}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
    ports: ["8080:8080"]
    depends_on:
      db: { condition: service_healthy }
  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      CRM_API_URL: http://api:8080/api/v1
      NODE_ENV: production
    ports: ["3000:3000"]
    depends_on:
      api: { condition: service_started }
volumes:
  postgres_data:
