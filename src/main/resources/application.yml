server:
  port: ${PORT:8080}
  error:
    include-message: never
spring:
  application:
    name: referral-crm-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/referral_crm}
    username: ${DB_USERNAME:referral}
    password: ${DB_PASSWORD:referral_local}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    baseline-on-migrate: false
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
app:
  jwt:
    secret: ${JWT_SECRET:local-only-change-this-secret-to-a-random-32-byte-minimum-value}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:720}
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:3000}
